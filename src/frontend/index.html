<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <title>Selskabsspils Agent</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f5f5f5;
    }

    h1 {
      text-align: center;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    textarea {
      width: 100%;
      height: 100px;
      font-size: 16px;
      padding: 10px;
      box-sizing: border-box;
    }

    button {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    #answer {
      margin-top: 20px;
      padding: 15px;
      background-color: #eef2ff;
      border-radius: 8px;
      white-space: pre-wrap;
      min-height: 80px;
    }

    .examples button {
      margin-right: 8px;
      margin-bottom: 8px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="box">
  <h1>Selskabsspils Agent</h1>

  <p>Stil et spørgsmål om Meyer, Fisk, Vandfald, Beer Pong eller Snyd.</p>

  <div class="examples">
    <button onclick="setQuestion('Hvordan spiller man Meyer?')">Meyer</button>
    <button onclick="setQuestion('Hvilket spil kan vi spille med kort?')">Kortspil</button>
    <button onclick="setQuestion('Hvad skal man bruge til Beer Pong?')">Beer Pong</button>
    <button onclick="setQuestion('Hvad er reglerne i Snyd?')">Snyd</button>
  </div>

  <textarea id="question" placeholder="Skriv dit spørgsmål her..."></textarea>

  <br>

  <button onclick="askAgent()">Spørg agenten</button>

  <div id="answer">Svaret vises her...</div>
</div>

<script>
  function setQuestion(text) {
    document.getElementById("question").value = text;
  }

  async function askAgent() {
    const question = document.getElementById("question").value;
    const answerBox = document.getElementById("answer");

    if (!question.trim()) {
      answerBox.textContent = "Skriv et spørgsmål først.";
      return;
    }

    answerBox.textContent = "Henter svar...";

    try {
      const response = await fetch("http://localhost:8000/ask", {
        method: "POST",
        headers: {
          "Content-Type": "application/json; charset=utf-8"
        },
        body: JSON.stringify({
          question: question
        })
      });

      if (!response.ok) {
        throw new Error("Serveren svarede med status: " + response.status);
      }

      const data = await response.json();

      answerBox.textContent =
        data.answer ||
        data.response ||
        data.result ||
        JSON.stringify(data, null, 2);

    } catch (error) {
      answerBox.textContent = "Der skete en fejl:\n" + error.message;
    }
  }
</script>

</body>
</html>
